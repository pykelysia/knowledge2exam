[project]
name = "knowledge2exam"
version = "0.1.0"
description = "试卷生成工具后端（面向学生的课程资料 → 模拟试卷）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.17",
    "PyJWT>=2.10",
    "bcrypt>=4.2",
    "sse-starlette>=2.1",
    "langgraph>=0.2.60",
    "openai>=1.50.0",
    "httpx>=0.28",
    "pymupdf",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "Pillow>=10.0",
    "langchain>=1.4.0",
    "langchain-openai>=1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
