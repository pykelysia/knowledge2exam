services:
  db:
    image: pgvector/pgvector:pg16
    container_name: k2e-db
    environment:
      POSTGRES_USER: k2e
      POSTGRES_PASSWORD: k2e
      POSTGRES_DB: knowledge2exam
    ports:
      - "5433:5432"
    volumes:
      - k2e_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k2e -d knowledge2exam"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  k2e_pgdata:
