openapi: 3.0.3
info:
  title: knowledge2exam API
  version: 1.0.0
  description: |
    试卷生成工具后端接口契约。REST + SSE，所有端点前缀 `/api/v1`。请求与响应均为 JSON，
    除上传接口用 `multipart/form-data`。

    本文件是前后端共用的机器可读契约，与后端 `app/schemas`、前端 `frontend/src/api/types.ts`
    保持同步。两个工作区（前端 / 后端）均可由此生成客户端 SDK 或服务端骨架。
servers:
  - url: /api/v1
    description: 相对路径（同源部署，经反向代理去掉前缀）
security: []
tags:
  - name: Auth
    description: 注册、登录、刷新与登出
  - name: Uploads
    description: 上传与手动输入
  - name: Jobs
    description: 生成任务、进度与产物
  - name: Revisions
    description: 划选反馈修订（job 级会话记录）
  - name: Catalog
    description: 学校与课程列表（课程为全局实体，与学校解绑）
  - name: Files
    description: 个人库（我的上传 + 公开池保存的引用）与文件预览
  - name: Pool
    description: 公开池浏览、检索与引用级保存
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 注册账号（可选学校归属）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          $ref: '#/components/responses/UserExists'
  /auth/me:
    patch:
      tags: [Auth]
      operationId: updateMe
      summary: 修改个人资料（学校归属；显式 null 清除）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 已更新，返回最新用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 登录，设置 httpOnly Cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回用户信息；认证信息通过 httpOnly Cookie 传递
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: 刷新 access token 并轮换 refresh token（通过 Cookie）
      security: []
      responses:
        '200':
          description: 刷新成功，返回用户信息；新认证信息通过 httpOnly Cookie 传递
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 登出，清除 Cookie 并吊销 refresh token
      security: []
      responses:
        '204':
          description: 已登出
        '401':
          $ref: '#/components/responses/Unauthorized'
  /uploads:
    post:
      tags: [Uploads]
      operationId: createUpload
      summary: 上传单个文件或提交文本（上传即异步解析）
      description: |
        两种载荷互斥：文件上传用 `multipart/form-data`，文本提交用 `application/json`。
        文件上传登记后立即异步解析进知识库（parse_status: pending → parsing → succeeded/failed），
        个人库轮询 `GET /files/mine` 获取进度；解析完成后可在任意任务中复用，不再二次解析。
        `manual_text` 与 `extra_requirement` 不接受 `visibility` 字段，传入即 400。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source_type]
              properties:
                file:
                  type: string
                  format: binary
                  description: 文件本体。支持 docx/pptx/pdf/md/txt/jpg/jpeg/png/webp/bmp
                source_type:
                  $ref: '#/components/schemas/SourceTypeFile'
                visibility:
                  type: string
                  enum: [private, school, public]
                  default: private
                  description: 可见性。private 仅本人；school 同校可见（必须同时提供 school_id）；public 全局公开池
                school_id:
                  type: string
                  format: uuid
                  description: 学校标签。锁定为本人注册学校（须与其相等）；注册未选学校的用户不可携带
                course_id:
                  type: string
                  format: uuid
                  description: 课程标签（可选，课程为全局实体）
          application/json:
            schema:
              $ref: '#/components/schemas/TextUploadCreate'
      responses:
        '201':
          description: 上传已受理（文件类解析异步进行，文本类即时完成）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /uploads/{upload_id}:
    patch:
      tags: [Uploads]
      operationId: updateUpload
      summary: 修改可见性 / 标签（仅 owner）
      description: 未提供的字段保持不变，显式 null 清除标签。本校可见必须带学校标签。
      parameters:
        - $ref: '#/components/parameters/UploadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUpdateRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Uploads]
      operationId: deleteUpload
      summary: 软删除上传件
      description: |
        置 `deleted_at` 并清理存储与向量数据；仅当被非终态任务引用时拒绝（409）。
        已被他人保存引用的文件仍可删除——引用侧个人库条目保留并标记「文件已失效」。
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204':
          description: 已删除（幂等）
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UploadInUse'
  /files/mine:
    get:
      tags: [Files]
      operationId: listMyFiles
      summary: 个人库列表（分页）
      description: |
        我的上传（活跃、非任务输入文本类）∪ 公开池保存的引用（file_import，含原件
        已删除的行）。`status`：available / parsing / failed / deleted（deleted 即「文件已失效」）。
        前端在存在 parsing 条目时轮询本接口刷新解析进度。
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 个人库条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResponse'
  /files/{upload_id}/preview:
    get:
      tags: [Files]
      operationId: previewFile
      summary: 文件预览（个人库与公开池共用）
      description: |
        权限 = owner 或已保存引用或池内可见（public，或 school 且与观看者同校）。
        返回解析产物文本，超过 max_preview_chars（默认 20000 字符）截断并置 truncated。
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: 预览内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPreview'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 文件尚未解析完成或解析失败（UPLOAD_NOT_PARSED）
  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: 当前用户任务列表
      description: 最近 50 条，按创建时间倒序。列表项不含 progress / plan.distribution 聚合
        （以详情端点为准）。
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsResponse'
    post:
      tags: [Jobs]
      operationId: createJob
      summary: 创建生成任务
      description: |
        立即返回 `job_id`（202），生成异步进行。上传件须为本人上传或已保存引用
        （file_import），且全部 `parse_status=succeeded`（否则 409 UPLOAD_NOT_PARSED）。
        学校/课程标签从所选文件自动推导（全部同校且同课时生效，用于课程偏好作用域）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
      responses:
        '202':
          description: 任务已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 存在未解析完成的文件（UPLOAD_NOT_PARSED）
  /jobs/{job_id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: 任务快照（轮询降级用）
      description: 与 SSE 状态一致。`last_event_seq` 可用于 SSE 重连续传。
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 任务当前快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/JobNotFound'
    delete:
      tags: [Jobs]
      operationId: deleteJob
      summary: 删除任务及产物
      description: 删除任务及其阶段记录与存储产物；已共享资源不随之删除。
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '204':
          description: 已删除
        '404':
          $ref: '#/components/responses/JobNotFound'
  /jobs/{job_id}/events:
    get:
      tags: [Jobs]
      operationId: streamJobEvents
      summary: SSE 进度流
      description: |
        `Content-Type: text/event-stream`。每帧含 `id`（对应 `job_stage.seq`）、`event`、`data`。
        客户端断连后用 `Last-Event-ID` 头重连，服务端从该 `seq` 之后补发。

        事件类型与 `data` 结构（由 `app/orchestration/stages.py` 发出）：

        - `stage_changed`：`{stage, previous}` —— 阶段切换（preprocessing / generating / rendering）；
          首帧 `previous` 为 `pending`，后续帧为上一个 Stage
        - `plan_ready`：`{total, distribution, reference_used, duration_minutes}` ——
          agent 出题蓝图就绪；`distribution` 按题型（choice / blank / short_answer）计数，
          `reference_used` 当前恒为 `agent_planning`
        - `progress`：`{completed, total}` —— 蓝图驱动的出题进度（todo 状态统计）
        - `warning`：`{code, upload_id?, message}` —— 非致命告警；
          `code` ∈ PARSE_FAILED / OCR_DEGRADED / AGENT_WARNING / RENDER_FAILED
        - `error`：`{error_code, message}` —— 管线意外异常，任务定格 failed
        - `revision_started`：`{round_no, feedback}` —— 一轮划选反馈修订开始
        - `revision_done`：`{round_no, render_status}` —— 修订完成，试卷已更新并重渲染
        - `revision_failed`：`{round_no, message}` —— 修订失败（agent 异常或未产生修改）
        - `preference_saved`：`{round_no, note}` —— 勾选的反馈已沉淀为课程出题偏好
          （服务端静默处理，note 为合并结果说明）
        - `done`：`{status, total?, abandoned?, md_url?, pdf_url?}` —— 终态关闭事件；
          `status` ∈ completed / partially_completed / failed / cancelled（取消时仅含 status）
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: Last-Event-ID
          in: header
          required: false
          description: 断线重连续传：服务端从该 seq 之后补发事件
          schema:
            type: integer
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
                description: "按 `id: <seq>\\nevent: <type>\\ndata: <json>\\n\\n` 帧序列"
        '404':
          $ref: '#/components/responses/JobNotFound'
  /jobs/{job_id}/paper.md:
    get:
      tags: [Jobs]
      operationId: downloadPaperMarkdown
      summary: 获取 md 试卷（含进行中预览）
      description: |
        agent 整卷直写 output/paper.md；任务进行中也可调用，返回当前正在书写的稿子
        （md_key 尚未提交时回退读取工作区文件），支撑前端渐进预览。
        题卷在前，答案与解析单独成篇。
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Markdown 试卷
          content:
            text/markdown:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          $ref: '#/components/responses/JobNotReady'
  /jobs/{job_id}/paper.pdf:
    get:
      tags: [Jobs]
      operationId: downloadPaperPdf
      summary: 下载 PDF 试卷
      description: |
        任务未到 `rendering` 完成时返回 409；`partially_completed` 且 PDF 渲染失败时返回 409 `RENDER_FAILED`。
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: PDF 试卷
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          $ref: '#/components/responses/JobNotReady'
  /jobs/{job_id}/cancel:
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: 取消运行中的任务
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '204':
          description: 已发出取消
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          $ref: '#/components/responses/JobAlreadyFinished'
  /jobs/{job_id}/revisions:
    post:
      tags: [Revisions]
      operationId: createRevision
      summary: 提交一轮划选反馈修订
      description: |
        用户在试卷预览中划选一部分内容并提出要求；请求交回完成该任务的 agent
        （同一全套工具，携带划选锚点、反馈与全部历史轮次）直接续跑修改
        output/paper.md 并重渲染。试卷内容直接生效，修订前后快照留存于
        paper_revision 表。仅限 completed / partially_completed 任务，且同任务
        同时只能有一轮修订在跑。
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionCreate'
      responses:
        '202':
          description: 修订已受理，后台续跑
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionAccepted'
        '400':
          description: 载荷不合法（如 feedback 为空）
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          description: 任务未完成（JOB_NOT_FINISHED）或已有修订在跑（REVISION_IN_PROGRESS）
    get:
      tags: [Revisions]
      operationId: listRevisions
      summary: 修订会话历史
      description: 该任务的全部修订轮次（新→旧），即修订会话记录。
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 修订历史
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionsResponse'
        '404':
          $ref: '#/components/responses/JobNotFound'
  /schools:
    get:
      tags: [Catalog]
      operationId: listSchools
      summary: 学校列表
      security: []
      responses:
        '200':
          description: 学校列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolsResponse'
  /courses:
    get:
      tags: [Catalog]
      operationId: listCourses
      summary: 全局课程列表
      description: 课程为全局实体（与学校解绑），附每课程公开池可见文件数。
      security: []
      responses:
        '200':
          description: 课程列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursesResponse'
  /pool/files:
    get:
      tags: [Pool]
      operationId: listPoolFiles
      summary: 公开池浏览 / 检索
      description: |
        可见谓词：`deleted_at IS NULL AND (public OR (school AND 文件学校 == 观看者学校))`，
        排除本人上传。`q` = 文件名/学校/课程关键词 ∪ 内容语义检索（embedding 失败时降级为关键词）。
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: 关键词或语义查询
        - name: school_id
          in: query
          schema: { type: string, format: uuid }
        - name: course_id
          in: query
          schema: { type: string, format: uuid }
        - name: source_type
          in: query
          schema:
            $ref: '#/components/schemas/SourceTypeFile'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 池内文件（含 is_saved 与 semantic_score）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolFilesResponse'
  /pool/files/{upload_id}/import:
    post:
      tags: [Pool]
      operationId: savePoolFile
      summary: 保存到个人库（引用级，不复制数据；幂等）
      description: 仅池内可见且非本人的文件可保存；授权落库即持久，原件转私不影响已保存引用。
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportAccepted'
        '403':
          description: 该文件当前不可保存（IMPORT_NOT_ALLOWED）
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Pool]
      operationId: unsavePoolFile
      summary: 取消保存（移除个人库引用；幂等）
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204':
          description: 已取消保存
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        Cookie 认证。登录成功后，后端设置 httpOnly Cookie `access_token`（JWT，15 分钟）与
        `refresh_token`（不透明令牌，30 天）。前端请求需携带 `withCredentials: true`，
        浏览器会自动附带 Cookie。刷新与登出同样通过 Cookie 传递 refresh_token。
  parameters:
    UploadId:
      name: upload_id
      in: path
      required: true
      description: 上传件 ID
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      description: 任务 ID
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 请求参数或载荷不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JobNotFound:
      description: 任务不存在或无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: 超出文件大小上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadInUse:
      description: 上传件已被任务引用，不可删除
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JobNotReady:
      description: 产物尚未生成，或 PDF 渲染失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JobAlreadyFinished:
      description: 任务已终结，不可取消
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UserExists:
      description: 邮箱或用户名已被注册
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCredentials:
      description: 登录凭证错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未携带有效 access token，或 refresh token 已吊销/过期/重放
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 按字节计最长 72（bcrypt 限制），中文等多字节字符需注意
        school_id:
          type: string
          format: uuid
          nullable: true
          description: 学校归属（可选），决定「本校可见」文件的观看资格
    LoginRequest:
      type: object
      required: [password]
      description: "`email` 与 `username` 二选一，优先 email。"
      properties:
        email:
          type: string
          format: email
          nullable: true
        username:
          type: string
          nullable: true
        password:
          type: string
          maxLength: 72
          description: 按字节计最长 72（bcrypt 限制）
    User:
      type: object
      required: [user_id, email, username]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        school_id:
          type: string
          format: uuid
          nullable: true
          description: 学校归属（本校可见资格）；未设置为 null
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    SourceTypeFile:
      type: string
      description: 文件类内容类型
      enum: [book, lecture, note, keypoint_list, past_paper]
    SourceType:
      type: string
      description: 全部内容类型（含手动输入）
      enum: [book, lecture, note, keypoint_list, past_paper, manual_text, extra_requirement]
    TextUploadCreate:
      type: object
      required: [source_type, raw_text]
      description: 手动输入文本提交。`source_type` 仅限 manual_text / extra_requirement，不接受 `visibility`。
      properties:
        source_type:
          type: string
          enum: [manual_text, extra_requirement]
        raw_text:
          type: string
          minLength: 1
          maxLength: 200000
          description: 文本正文；extra_requirement 另受 max_extra_requirement_chars（默认 2000）限制
    Upload:
      type: object
      description: 上传件（响应）
      required: [upload_id, source_type]
      properties:
        upload_id:
          type: string
          format: uuid
        source_type:
          $ref: '#/components/schemas/SourceType'
        filename:
          type: string
          nullable: true
          description: 文件名，手动输入时为 null
        size_bytes:
          type: integer
          nullable: true
          description: 文件大小，手动输入时为 null
        visibility:
          type: string
          enum: [private, school, public]
          description: 可见性；手动输入恒为 private
        parse_status:
          type: string
          enum: [pending, parsing, succeeded, failed]
          description: 解析状态；文本类创建即 succeeded，文件类异步收敛
    UploadUpdateRequest:
      type: object
      description: 修改可见性 / 标签；未提供的字段保持不变，显式 null 清除标签
      properties:
        visibility:
          type: string
          enum: [private, school, public]
        school_id:
          type: string
          format: uuid
          nullable: true
        course_id:
          type: string
          format: uuid
          nullable: true
    FileOwner:
      type: object
      required: [user_id, username]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
    LibraryFile:
      type: object
      description: 个人库条目：我的上传或从公开池保存的引用
      required: [upload_id, source_type, visibility, parse_status, created_at, owner, imported, status]
      properties:
        upload_id: { type: string, format: uuid }
        source_type: { $ref: '#/components/schemas/SourceType' }
        filename: { type: string, nullable: true }
        size_bytes: { type: integer, nullable: true }
        visibility: { type: string, enum: [private, school, public] }
        school_id: { type: string, format: uuid, nullable: true }
        course_id: { type: string, format: uuid, nullable: true }
        char_count: { type: integer, nullable: true }
        parse_status: { type: string, enum: [pending, parsing, succeeded, failed] }
        parse_error: { type: string, nullable: true }
        parse_warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
        created_at: { type: string, format: date-time }
        owner: { $ref: '#/components/schemas/FileOwner' }
        imported: { type: boolean, description: 是否为公开池保存的引用 }
        imported_at: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [available, parsing, failed, deleted]
          description: deleted 即「文件已失效」（原件已被删除）
    LibraryResponse:
      type: object
      required: [files, total, page, page_size]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/LibraryFile'
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    UploadPreview:
      type: object
      description: 文件预览（基于解析产物文本）
      required: [upload_id, source_type, visibility, text, truncated]
      properties:
        upload_id: { type: string, format: uuid }
        filename: { type: string, nullable: true }
        source_type: { $ref: '#/components/schemas/SourceType' }
        visibility: { type: string, enum: [private, school, public] }
        school_id: { type: string, format: uuid, nullable: true }
        course_id: { type: string, format: uuid, nullable: true }
        school_name: { type: string, nullable: true }
        course_name: { type: string, nullable: true }
        char_count: { type: integer, nullable: true }
        text: { type: string, description: 解析文本（截断至 max_preview_chars） }
        truncated: { type: boolean }
    PoolFile:
      type: object
      description: 公开池条目（本校 + 全局可见，排除本人上传）
      required: [upload_id, source_type, visibility, created_at, owner, is_saved]
      properties:
        upload_id: { type: string, format: uuid }
        source_type: { $ref: '#/components/schemas/SourceType' }
        filename: { type: string, nullable: true }
        size_bytes: { type: integer, nullable: true }
        visibility: { type: string, enum: [school, public] }
        school_id: { type: string, format: uuid, nullable: true }
        course_id: { type: string, format: uuid, nullable: true }
        school_name: { type: string, nullable: true }
        course_name: { type: string, nullable: true }
        char_count: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        owner: { $ref: '#/components/schemas/FileOwner' }
        is_saved: { type: boolean, description: 是否已保存到个人库 }
        semantic_score: { type: number, nullable: true, description: 语义检索得分（仅 q 语义命中时） }
    PoolFilesResponse:
      type: object
      required: [files, total, page, page_size]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/PoolFile'
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    ImportAccepted:
      type: object
      required: [saved, upload_id]
      properties:
        saved: { type: boolean }
        upload_id: { type: string, format: uuid }
    UserUpdateRequest:
      type: object
      description: 修改个人资料；显式 null 清除学校归属
      properties:
        school_id: { type: string, format: uuid, nullable: true }
    JobCreate:
      type: object
      description: 创建任务请求。学校/课程标签从所选文件自动推导（全部同校且同课时生效）
      properties:
        upload_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
          description: 本次使用的上传件（本人上传或已保存引用）；为空时返回 400 INPUT_EMPTY；须全部解析完成
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 300
          default: 100
          description: 考试时长
        need_explanation:
          type: boolean
          default: false
          description: 是否生成解析
    JobAccepted:
      type: object
      required: [job_id, status, created_at]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        created_at:
          type: string
          format: date-time
          description: ISO 8601 UTC，带 Z
    Plan:
      type: object
      description: 规划概要
      properties:
        total:
          type: integer
        distribution:
          type: object
          properties:
            choice:
              type: integer
            blank:
              type: integer
            short_answer:
              type: integer
    Progress:
      type: object
      properties:
        completed:
          type: integer
        total:
          type: integer
        retried:
          type: integer
        replanned:
          type: integer
        abandoned:
          type: integer
    Warning:
      type: object
      properties:
        code:
          type: string
          enum: [PARSE_FAILED, OCR_DEGRADED, AGENT_WARNING, RENDER_FAILED]
        upload_id:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
    Artifacts:
      type: object
      description: 产物下载地址
      properties:
        md_url:
          type: string
          nullable: true
          description: 相对路径，如 /api/v1/jobs/{job_id}/paper.md
        pdf_url:
          type: string
          nullable: true
    Job:
      type: object
      description: 任务快照
      required: [job_id, status, created_at]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/JobStatus'
        stage:
          $ref: '#/components/schemas/Stage'
        duration_minutes:
          type: integer
        need_explanation:
          type: boolean
        school_id:
          type: string
          format: uuid
          nullable: true
          description: 任务绑定的学校（偏好沉淀作用域之一，无则不可沉淀）
        course_id:
          type: string
          format: uuid
          nullable: true
          description: 任务绑定的课程（偏好沉淀作用域之一，无则不可沉淀）
        plan:
          $ref: '#/components/schemas/Plan'
        progress:
          $ref: '#/components/schemas/Progress'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        artifacts:
          $ref: '#/components/schemas/Artifacts'
        last_event_seq:
          type: integer
          description: SSE 续传游标
        error_code:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    JobsResponse:
      type: object
      description: 当前用户任务列表（GET /jobs）
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
    JobStatus:
      type: string
      enum: [pending, preprocessing, generating, rendering, completed, partially_completed, failed, cancelled]
      description: |
        任务状态机（见 app/orchestration/state_machine.py）：pending → preprocessing →
        generating → rendering → completed；rendering 亦可转入 partially_completed（PDF 渲染
        失败，仅交付 Markdown）；任一运行态可转入 failed / cancelled。
    Stage:
      type: string
      enum: [preprocessing, generating, rendering]
    SelectionAnchor:
      type: object
      description: 用户在试卷预览中划选的锚点：选中文本 + 前后文（内容定位，非偏移）。
      required: [text]
      properties:
        text:
          type: string
          description: 用户划选的文本
        before:
          type: string
          description: 选区前文（少量上下文）
        after:
          type: string
          description: 选区后文（少量上下文）
    RevisionCreate:
      type: object
      description: 提交一轮修订：划选位置与内容 + 用户要求。
      required: [selection, feedback]
      properties:
        selection:
          $ref: '#/components/schemas/SelectionAnchor'
        feedback:
          type: string
          description: 用户对所选部分的修订要求
        save_preference:
          type: boolean
          default: false
          description: 是否把本条反馈沉淀为该课程（同校同课程作用域）的持久出题偏好
    RevisionAccepted:
      type: object
      required: [revision_id, round_no, status]
      properties:
        revision_id:
          type: string
          format: uuid
        round_no:
          type: integer
          description: 轮次号，从 1 递增
        status:
          type: string
          enum: [running]
    RevisionItem:
      type: object
      description: 修订历史条目（会话记录）。快照不随列表返回。
      required: [revision_id, round_no, status, feedback, created_at]
      properties:
        revision_id:
          type: string
          format: uuid
        round_no:
          type: integer
        status:
          type: string
          enum: [running, done, failed]
        selection:
          allOf:
            - $ref: '#/components/schemas/SelectionAnchor'
          nullable: true
        feedback:
          type: string
        summary:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
          nullable: true
        preference_saved:
          type: boolean
          description: 本轮反馈是否已沉淀为课程出题偏好
    RevisionsResponse:
      type: object
      required: [job_id, total, revisions]
      properties:
        job_id:
          type: string
          format: uuid
        total:
          type: integer
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/RevisionItem'
    SchoolsResponse:
      type: object
      required: [schools]
      properties:
        schools:
          type: array
          items:
            $ref: '#/components/schemas/School'
    School:
      type: object
      required: [school_id, name]
      properties:
        school_id:
          type: string
          format: uuid
        name:
          type: string
    CoursesResponse:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/Course'
    Course:
      type: object
      required: [course_id, name]
      properties:
        course_id:
          type: string
          format: uuid
        name:
          type: string
        pool_file_count:
          type: integer
          description: 该课程在公开池（本校 + 全局可见）中的活跃文件数
    ErrorResponse:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        detail:
          type: object
          additionalProperties: true
          description: 结构化的补充信息，随错误码不同而异
    ErrorCode:
      type: string
      description: |
        错误码全集（与 app/core/exceptions.py 的 ErrorCode 一致）。含仅作为 warning / error
        事件出现、无 HTTP 状态的码（如 PARSE_FAILED、AGENT_WARNING、PIPELINE_FAILED）。
      enum:
        - INPUT_EMPTY
        - UNSUPPORTED_FORMAT
        - FILE_TOO_LARGE
        - PDF_ENCRYPTED
        - SHARE_NOT_ALLOWED
        - SHARE_SCOPE_REQUIRED
        - INVALID_DURATION
        - JOB_NOT_FOUND
        - SCHOOL_NOT_FOUND
        - COURSE_NOT_FOUND
        - UPLOAD_IN_USE
        - UPLOAD_NOT_PARSED
        - IMPORT_NOT_ALLOWED
        - JOB_NOT_READY
        - JOB_ALREADY_FINISHED
        - JOB_NOT_FINISHED
        - REVISION_IN_PROGRESS
        - PAPER_NOT_READY
        - PREFERENCE_SCOPE_REQUIRED
        - PARSE_FAILED
        - OCR_DEGRADED
        - PLANNING_FAILED
        - GENERATION_EXHAUSTED
        - RENDER_FAILED
        - AGENT_WARNING
        - PIPELINE_FAILED
        - SERVER_RESTARTED
        - MODEL_UNAVAILABLE
        - RATE_LIMITED
        - USER_EXISTS
        - INVALID_CREDENTIALS
        - TOKEN_MISSING
        - TOKEN_EXPIRED
        - REFRESH_INVALID
        - REFRESH_REUSE_DETECTED
